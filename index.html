<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Iza:time">
  <meta name="description" content="Iza:time — a calm, intelligent AI study suite: plan sessions, review with spaced repetition, focus with Pomodoro, and track real progress.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <title>Iza:time | AI Study Suite</title>
</head>
<body>

  <div id="splash">
    <span class="splash-icon">⏳</span>
    <span class="splash-title">Iza:time</span>
    <span class="splash-sub">AI Study Suite</span>
  </div>

  <div id="offlineRibbon">📡 Offline · changes are saved on this device</div>

  <div id="installBanner">
    <div class="install-left">
      <div class="install-icon">⏳</div>
      <div class="install-text">
        <div class="install-title">Install Iza:time</div>
        <div class="install-sub">Add to your home screen for the full app experience</div>
      </div>
    </div>
    <div class="install-actions">
      <button class="btn-dismiss" id="btnDismiss">Later</button>
      <button class="btn-install" id="btnInstall">Install</button>
    </div>
  </div>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand"><span class="brand-icon">⏳</span>Iza:time</div>
      <button id="btnSettings" class="icon-btn" aria-label="Settings">⚙️</button>
    </header>

    <main id="view-root" class="view-root"></main>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <div id="toast-root"></div>
  <div id="modal-root" class="modal"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
