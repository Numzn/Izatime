<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Digital Timetable">
  <meta name="description" content="Digital Timetable — your class schedule plus a calm study companion: spaced repetition review, focus timer, and real progress tracking.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <title>Digital Timetable</title>
</head>
<body>

  <div id="splash">
    <span class="splash-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3v4"/><path d="M16 3v4"/></svg></span>
    <span class="splash-title">Digital Timetable</span>
    <span class="splash-sub">Study Companion</span>
  </div>

  <div id="offlineRibbon">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M3 9c1.8-1.6 4-2.7 6.3-3.2M14.7 5.8A13 13 0 0 1 21 9M6.3 12.8a8.5 8.5 0 0 1 3-1.7M17.7 12.8a8.5 8.5 0 0 0-2-1.4M9.5 16.3a4 4 0 0 1 5 0"/><circle cx="12" cy="19.5" r="0.55" fill="currentColor"/></svg>
    <span>Offline · changes are saved on this device</span>
  </div>

  <div id="installBanner">
    <div class="install-left">
      <div class="install-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3v4"/><path d="M16 3v4"/></svg></div>
      <div class="install-text">
        <div class="install-title">Install Digital Timetable</div>
        <div class="install-sub">Add to your home screen for the full app experience</div>
      </div>
    </div>
    <div class="install-actions">
      <button class="btn-dismiss" id="btnDismiss">Later</button>
      <button class="btn-install" id="btnInstall">Install</button>
    </div>
  </div>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand"><span class="brand-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3v4"/><path d="M16 3v4"/></svg></span>Digital Timetable</div>
      <button id="btnSettings" class="icon-btn" aria-label="Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M17.7 6.3l-1.6 1.6M7.9 16.1l-1.6 1.6M17.7 17.7l-1.6-1.6M7.9 7.9 6.3 6.3"/></svg></button>
    </header>

    <main id="view-root" class="view-root"></main>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <div id="toast-root"></div>
  <div id="modal-root" class="modal"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
